# The CLIs and the layout crate they share with the XDP program, on stable Rust.
# The XDP program itself is built separately, by a pinned nightly, from
# xdpgate-ebpf/ (see ADR 0001); the Makefile builds the two in turn.
[workspace]
members = ["xdpgate", "xdpgate-common"]
exclude = ["xdpgate-ebpf"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
publish = false

# A bug stops with a message instead of printing a wrong number. The one place
# that must not stop, expiry arithmetic on values read from the maps, wraps
# explicitly.
[profile.release]
overflow-checks = true
