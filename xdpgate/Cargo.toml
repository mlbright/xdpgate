[package]
name = "xdpgate"
description = "The xdpgate command-line tools and the build's object check"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
xdpgate-common = { path = "../xdpgate-common" }

[[bin]]
name = "xdpgate-ctl"
path = "src/bin/xdpgate-ctl.rs"

# Not installed: the Makefile runs it on every freshly built xdpgate.bpf.o.
[[bin]]
name = "check-object"
path = "src/bin/check-object.rs"
test = false
